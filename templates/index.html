<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FlaskGPT — Assistant IA</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/output.css') }}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.2.0/styles/default.min.css">

    <script defer src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.2.0/highlight.min.js"></script>
    <script defer src="{{ url_for('static', filename='js/script.js') }}"></script>
</head>

<body class="bg-slate-50 text-slate-800">
    <main class="mx-auto flex min-h-screen max-w-4xl flex-col px-4 py-8">
        <header class="mb-8 flex flex-wrap items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">FlaskGPT</h1>
                <p class="mt-1 text-sm text-slate-500">
                    Your intelligent assistant.
                </p>
            </div>
            <button id="new-conversation" type="button"
                    class="rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm font-medium hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-indigo-500 disabled:cursor-wait disabled:opacity-50">
                Nouvelle conversation
            </button>
        </header>

        <div class="mb-6">
            <label for="saved-conversations" class="mb-2 block text-sm font-medium">
                Conversations enregistrées
            </label>
            <select id="saved-conversations"
                    class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 disabled:cursor-wait disabled:opacity-50">
                <option value="">Nouvelle conversation</option>
            </select>
            <div class="mt-3 flex flex-wrap items-end gap-3">
                <div>
                    <label for="export-format" class="mb-2 block text-sm font-medium">Format d'export</label>
                    <select id="export-format"
                            class="rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 disabled:opacity-50">
                        <option value="csv">CSV (.csv)</option>
                        <option value="md">Markdown (.md)</option>
                        <option value="json">JSON (.json)</option>
                    </select>
                </div>
                <button id="export-conversation" type="button" disabled
                        class="rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm font-medium hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-indigo-500 disabled:cursor-not-allowed disabled:opacity-50">
                    Exporter cette conversation
                </button>
                <button id="export-all-conversations" type="button" disabled
                        class="rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm font-medium hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-indigo-500 disabled:cursor-not-allowed disabled:opacity-50">
                    Tout exporter
                </button>
            </div>
            <p id="conversation-status" role="status" class="mt-2 text-sm text-slate-500"></p>
        </div>

        <div class="mb-6">
            <label for="specialty" class="mb-2 block text-sm font-medium">
                Spécialité de la conversation
            </label>
            <select id="specialty" name="specialty" aria-describedby="specialty-help"
                    class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 disabled:cursor-wait disabled:opacity-50">
                {% for value, specialty in specialties.items() %}
                <option value="{{ value }}">{{ specialty.label }}</option>
                {% endfor %}
            </select>
            <p id="specialty-help" class="mt-2 text-sm text-slate-500">
                Changer de spécialité démarre une nouvelle conversation.
            </p>
        </div>

        <div id="chat-template" class="hidden mb-4 rounded-2xl border border-slate-200 odd:bg-slate-50 even:bg-white p-5 shadow-xs">
            <div class="message leading-relaxed break-words"></div>
        </div>

        <div id="gpt-output" class="flex-1" aria-live="polite"></div>

        <form id="document-form" class="mt-6 rounded-2xl border border-slate-200 bg-white p-5">
            <label for="document-file" class="mb-2 block text-sm font-medium">Importer un fichier à résumer</label>
            <p id="document-help" class="mb-3 text-sm text-slate-500">
                TXT, Markdown, CSV, PDF ou Word (.docx). Maximum 10 Mo et 60 000 caractères de texte.
            </p>
            <div class="flex flex-wrap items-center gap-3">
                <input id="document-file" name="file" type="file" required
                       accept=".txt,.md,.csv,.pdf,.docx" aria-describedby="document-help"
                       class="min-w-0 flex-1 rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm disabled:opacity-50">
                <button id="summarize-document" type="submit" disabled
                        class="rounded-xl bg-indigo-600 px-5 py-3 font-medium text-white hover:bg-indigo-700 focus-visible:outline-2 focus-visible:outline-indigo-500 disabled:cursor-not-allowed disabled:opacity-50">
                    Résumer le fichier
                </button>
            </div>
        </form>

        <form id="prompt-form"
              class="sticky bottom-0 mt-6 flex gap-3 bg-slate-50 py-4">
            <label for="prompt" class="sr-only">Your message</label>

            <input id="prompt" name="prompt" type="text" required
                   placeholder="Ask your question…"
                   class="min-w-0 flex-1 rounded-xl border border-slate-300 bg-white px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">

            <button type="submit"
                    class="rounded-xl bg-indigo-600 px-5 py-3 font-medium text-white hover:bg-indigo-700 disabled:cursor-wait disabled:opacity-50">
                Send
            </button>
        </form>
    </main>
</body>
</html>
